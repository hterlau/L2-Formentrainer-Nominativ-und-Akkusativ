<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formen-Trainer Lektion 1–2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one centered work column; a group of word rows, each row = given form + three answer fields; result and tips appear under the group. */
:root {
  --bg: #eef1f2;          /* cool travertine */
  --surface: #ffffff;
  --ink: #1d2a33;
  --muted: #5b6a73;
  --line: #cfd8dc;
  --accent: #8a5a12;      /* ochre, like the Roman road signs */
  --accent-ink: #ffffff;
  --ok: #1f7a4a;
  --ok-bg: #e3f3ea;
  --bad: #b3261e;
  --bad-bg: #fbe7e5;
  --tag: #e2e8ea;
  --font-display: "Marcellus", "Palatino Linotype", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141b20; --surface: #1d262c; --ink: #e6ecef; --muted: #9aa9b1; --line: #33424b;
  --accent: #e0a94c; --accent-ink: #1a1408; --ok: #6fd39c; --ok-bg: #173a29; --bad: #ff8a80; --bad-bg: #44201d; --tag: #2a363d;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141b20; --surface: #1d262c; --ink: #e6ecef; --muted: #9aa9b1; --line: #33424b;
  --accent: #e0a94c; --accent-ink: #1a1408; --ok: #6fd39c; --ok-bg: #173a29; --bad: #ff8a80; --bad-bg: #44201d; --tag: #2a363d;
  color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.5; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.3rem); margin: 0; text-wrap: balance; letter-spacing: .01em; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 700; margin: 0 0 4px; }
.intro { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }

.status { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.steps { display: flex; gap: 6px; }
.step { width: 34px; height: 6px; border-radius: 3px; background: var(--line); }
.step.done { background: var(--ok); }
.step.now { background: var(--accent); }
.status-text { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 4px; }
.head, .row { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap: 10px; align-items: start; }
.head { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.row { padding-block: 10px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.word { font-family: var(--font-display); font-size: 1.3rem; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-top: 6px; min-width: 0; }
.gender { font-family: var(--font-body); font-size: .8rem; font-style: italic; color: var(--muted); background: var(--tag); border-radius: 4px; padding: 0 6px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { display: none; font-size: .75rem; color: var(--muted); font-weight: 600; }
.field input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1.05rem; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.field input:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; border-color: var(--accent); }
.field input.ok { border-color: var(--ok); background: var(--ok-bg); }
.field input.bad { border-color: var(--bad); background: var(--bad-bg); }
.fix { font-size: .9rem; color: var(--bad); font-weight: 600; }
.fix::before { content: "richtig: "; font-weight: 400; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
button { font: inherit; font-weight: 700; border-radius: 6px; padding: 10px 18px; cursor: pointer; border: 1.5px solid var(--accent); }
.primary { background: var(--accent); color: var(--accent-ink); }
.secondary { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.hint { color: var(--muted); font-size: .95rem; }

.feedback { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; }
.feedback h2, .end h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; }
.feedback ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.feedback li strong { color: var(--accent); }
.score { font-variant-numeric: tabular-nums; font-weight: 700; }

.end { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px 18px; display: grid; gap: 14px; }
.big { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--bad-bg); color: var(--bad); border-radius: 999px; padding: 2px 12px; font-weight: 600; }

@media (max-width: 640px) {
  .head { display: none; }
  .row { grid-template-columns: 1fr; gap: 8px; }
  .field label { display: block; }
}
@media (prefers-reduced-motion: no-preference) {
  .feedback, .end { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Latein · Lektion 1 und 2</p>
    <h1>Formen-Trainer: Nominativ Plural und Akkusativ</h1>
    <p class="intro">Bilde zu jedem Wort den Nominativ Plural, den Akkusativ Singular und den Akkusativ Plural. Längenstriche musst du nicht schreiben. Die Lösung erscheint, wenn alle Felder ausgefüllt sind und du auf „Prüfen“ klickst.</p>
  </header>

  <div class="status">
    <div class="steps" id="steps" aria-hidden="true"></div>
    <div class="status-text" id="statusText"></div>
  </div>

  <main id="main"></main>
</div>

<script>
const WORDS = [
  // [Nom Sg, Genus, Deklination, Nom Pl, Akk Sg, Akk Pl] – mit Längen für die Anzeige
  ["dominus","m","o","dominī","dominum","dominōs"],
  ["servus","m","o","servī","servum","servōs"],
  ["equus","m","o","equī","equum","equōs"],
  ["populus","m","o","populī","populum","populōs"],
  ["amīcus","m","o","amīcī","amīcum","amīcōs"],
  ["frūmentum","n","n","frūmenta","frūmentum","frūmenta"],
  ["fūrtum","n","n","fūrta","fūrtum","fūrta"],
  ["forum","n","n","fora","forum","fora"],
  ["domina","f","a","dominae","dominam","dominās"],
  ["serva","f","a","servae","servam","servās"],
  ["victōria","f","a","victōriae","victōriam","victōriās"],
  ["amīca","f","a","amīcae","amīcam","amīcās"],
  ["via","f","a","viae","viam","viās"],
  ["victor","m","3","victōrēs","victōrem","victōrēs"],
  ["mercātor","m","3","mercātōrēs","mercātōrem","mercātōrēs"],
].map(w => ({ nom: w[0], g: w[1], d: w[2], forms: [w[3], w[4], w[5]] }));

const COLS = ["Nominativ Pl.", "Akkusativ Sg.", "Akkusativ Pl."];
const ENDINGS = { a: "-ae / -am / -ās", o: "-ī / -um / -ōs", n: "-a / -um / -a", "3": "-ēs / -em / -ēs" };
const DECL_NAME = { a: "a-Deklination", o: "o-Deklination (m)", n: "o-Deklination (Neutrum)", "3": "3. Deklination" };

const TIPS = {
  neutrum: "<strong>Neutra</strong> (forum, fūrtum, frūmentum): Nominativ und Akkusativ sind immer gleich. Im Plural enden beide auf <strong>-a</strong>.",
  dritte: "<strong>3. Deklination</strong> (victor, mercātor): Akkusativ Singular auf <strong>-em</strong>, Nominativ und Akkusativ Plural auf <strong>-ēs</strong>.",
  asos: "<strong>-ās oder -ōs?</strong> -ās gehört zur a-Deklination (amīcās), -ōs zur o-Deklination (amīcōs).",
  werwen: "Du hast <strong>Nominativ Plural und Akkusativ Plural</strong> vertauscht. Wer? → Nominativ (servī, servae). Wen? → Akkusativ (servōs, servās).",
  stamm: "Prüfe den <strong>Wortstamm</strong>: Er bleibt gleich, nur die Endung ändert sich (victor → victōr-em).",
  a: "<strong>a-Deklination</strong>: Nom. Pl. -ae, Akk. Sg. -am, Akk. Pl. -ās.",
  o: "<strong>o-Deklination</strong>: Nom. Pl. -ī, Akk. Sg. -um, Akk. Pl. -ōs.",
};

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z]/g, "");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const escapeHtml = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function makeGroups(list) {
  const n = list.length, count = Math.max(1, Math.ceil(n / 5)), size = Math.floor(n / count), extra = n % count;
  const out = []; let i = 0;
  for (let g = 0; g < count; g++) { const len = size + (g >= count - extra ? 1 : 0); out.push(list.slice(i, i + len)); i += len; }
  return out;
}

let state;
function start(words) {
  state = { groups: makeGroups(shuffle(words)), idx: 0, points: 0, total: words.length * 3, wrongWords: new Set(), checked: false };
  renderGroup();
}

function renderSteps() {
  const s = document.getElementById("steps");
  s.innerHTML = state.groups.map((_, i) => `<span class="step ${i < state.idx ? "done" : i === state.idx ? "now" : ""}"></span>`).join("");
  document.getElementById("statusText").textContent = state.idx < state.groups.length
    ? `Gruppe ${state.idx + 1} von ${state.groups.length} · bisher ${state.points} Punkte`
    : `Fertig · ${state.points} von ${state.total} Punkten`;
}

function renderGroup() {
  state.checked = false;
  renderSteps();
  const group = state.groups[state.idx];
  const rows = group.map((w, r) => `
    <div class="row">
      <div class="word">${w.nom}<span class="gender">${w.g}</span></div>
      ${COLS.map((c, k) => `
        <div class="field">
          <label for="f-${r}-${k}">${c}</label>
          <input id="f-${r}-${k}" data-r="${r}" data-k="${k}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${w.nom}: ${c}">
          <div class="fix" id="x-${r}-${k}" hidden></div>
        </div>`).join("")}
    </div>`).join("");
  document.getElementById("main").innerHTML = `
    <section class="card" aria-label="Gruppe ${state.idx + 1}">
      <div class="head"><span>Nominativ Sg.</span>${COLS.map(c => `<span>${c}</span>`).join("")}</div>
      ${rows}
    </section>
    <div class="actions" style="margin-top:16px">
      <button class="primary" id="checkBtn" disabled>Prüfen</button>
      <span class="hint" id="hint"></span>
    </div>
    <div id="fb"></div>`;
  const inputs = [...document.querySelectorAll(".field input")];
  inputs.forEach((inp, i) => {
    inp.addEventListener("input", updateHint);
    inp.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const next = inputs.slice(i + 1).concat(inputs.slice(0, i)).find(x => !x.value.trim());
      if (next && !state.checked) next.focus();
      else if (!document.getElementById("checkBtn").disabled) check();
    });
  });
  document.getElementById("checkBtn").addEventListener("click", check);
  updateHint();
  inputs[0].focus({ preventScroll: true });
}

function updateHint() {
  if (state.checked) return;
  const empty = [...document.querySelectorAll(".field input")].filter(x => !x.value.trim()).length;
  document.getElementById("checkBtn").disabled = empty > 0;
  document.getElementById("hint").textContent = empty > 0
    ? `Noch ${empty} ${empty === 1 ? "Feld" : "Felder"} leer. Die Lösung erscheint, wenn überall etwas steht.`
    : "Alles ausgefüllt. Jetzt prüfen.";
}

function diagnose(w, k, given, tips) {
  const g = norm(given), forms = w.forms.map(norm);
  if (w.d === "n") tips.add("neutrum");
  if (w.d === "3") tips.add("dritte");
  if ((k === 0 && g === forms[2] && forms[0] !== forms[2]) || (k === 2 && g === forms[0] && forms[0] !== forms[2])) tips.add("werwen");
  if ((w.d === "a" && g.endsWith("os")) || (w.d === "o" && g.endsWith("as"))) tips.add("asos");
  const stem = norm(w.forms[1]).replace(/(um|am|em)$/, "");
  if (!g.startsWith(stem.slice(0, Math.max(2, stem.length - 1)))) tips.add("stamm");
  if (w.d === "a" || w.d === "o") tips.add(w.d);
}

function check() {
  if (state.checked) return;
  state.checked = true;
  const group = state.groups[state.idx];
  let pts = 0; const tips = new Set();
  document.querySelectorAll(".field input").forEach(inp => {
    const r = +inp.dataset.r, k = +inp.dataset.k, w = group[r];
    const right = norm(inp.value) === norm(w.forms[k]);
    inp.readOnly = true;
    inp.classList.add(right ? "ok" : "bad");
    if (right) pts++;
    else {
      const x = document.getElementById(`x-${r}-${k}`); x.textContent = w.forms[k]; x.hidden = false;
      state.wrongWords.add(w.nom);
      diagnose(w, k, inp.value, tips);
    }
  });
  state.points += pts;
  const max = group.length * 3;
  const btn = document.getElementById("checkBtn");
  btn.textContent = state.idx + 1 < state.groups.length ? "Nächste Gruppe" : "Zum Ergebnis";
  btn.disabled = false;
  btn.replaceWith(btn.cloneNode(true));
  document.getElementById("checkBtn").addEventListener("click", () => { state.idx++; state.idx < state.groups.length ? renderGroup() : renderEnd(); });
  document.getElementById("hint").textContent = "";
  const order = ["werwen", "neutrum", "dritte", "asos", "stamm", "a", "o"];
  const msg = pts === max
    ? "<p>Alles richtig. Stark! Du bildest die Formen in dieser Gruppe sicher.</p>"
    : pts >= max - 2
      ? "<p>Fast alles richtig. Schau dir die rot markierten Formen noch einmal an:</p>"
      : "<p>Hier lohnt sich eine Wiederholung. Diese Tipps helfen dir:</p>";
  document.getElementById("fb").innerHTML = `
    <section class="feedback" style="margin-top:16px" aria-live="polite">
      <h2>Rückmeldung · <span class="score">${pts} / ${max}</span></h2>
      ${msg}
      ${tips.size ? `<ul>${order.filter(t => tips.has(t)).map(t => `<li>${TIPS[t]}</li>`).join("")}</ul>` : ""}
    </section>`;
  renderSteps();
  document.getElementById("checkBtn").focus({ preventScroll: true });
}

function renderEnd() {
  renderSteps();
  const p = state.points, t = state.total, q = p / t;
  const verdict = q === 1 ? "Perfekt! Alle Formen sitzen."
    : q >= .85 ? "Sehr gut! Nur noch wenige Formen wackeln."
    : q >= .6 ? "Gut geübt. Wiederhole die Wörter mit Fehlern noch einmal."
    : "Übe die Endungen noch einmal mit der Tabelle aus dem Heft und starte dann neu.";
  const wrong = WORDS.filter(w => state.wrongWords.has(w.nom));
  document.getElementById("main").innerHTML = `
    <section class="end" aria-live="polite">
      <h2>Dein Ergebnis</h2>
      <div class="big">${p} / ${t}</div>
      <p style="margin:0">${verdict}</p>
      ${wrong.length ? `<div><p style="margin:0 0 8px" class="hint">Wörter mit Fehlern:</p><div class="chips">${wrong.map(w => `<span class="chip">${escapeHtml(w.nom)}</span>`).join("")}</div></div>` : ""}
      <div class="actions">
        ${wrong.length ? `<button class="primary" id="againWrong">Fehlerwörter üben</button>` : ""}
        <button class="${wrong.length ? "secondary" : "primary"}" id="againAll">Alle Wörter neu mischen</button>
      </div>
    </section>`;
  if (wrong.length) document.getElementById("againWrong").addEventListener("click", () => start(wrong));
  document.getElementById("againAll").addEventListener("click", () => start(WORDS));
}

start(WORDS);
</script>

</body>
</html>
